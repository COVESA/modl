

[project]
name = "ddmodl"
dynamic = ["version"]
description = "A tool for managing the identity ledger of a domain data model"
authors = [{name = "jdacoello", email="8550265+jdacoello@users.noreply.github.com"}]
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "click>=8.1.7",
    "pandas>=2.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich-click>=1.8.3",
    "rich>=13.9.4",
]
requires-python = ">=3.11"

[project.urls]
homepage = "https://github.com/COVESA/modl"
documentation = "https://github.com/COVESA/modl/blob/main/README.md"

[project.scripts]
modl = "modl.cli:cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/modl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/modl"]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest-cov",
    "pytest",
    "nox",
    "bump-my-version",
    "ty",
    "twine>=7.0.0",
    "git-cliff",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PGH", "B", "SIM"]

[tool.bumpversion]
current_version = "0.8.1"

[[tool.bumpversion.files]]
filename = "./src/modl/__init__.py"

[tool.git-cliff.changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
        {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}\
        {% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.remote.pr_number }}){% endif %}
    {% endfor %}
{% endfor %}\n
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^chore: release", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Changed" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI/CD" },
    { message = "^revert", group = "Reverted" },
    { message = "^[a|A]dd", group = "Added" },
    { message = "^[s|S]upport", group = "Added" },
    { message = "^[r|R]emove", group = "Removed" },
    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },
    { message = "^.*: fix", group = "Fixed" },
    { message = "^.*", group = "Changed" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
